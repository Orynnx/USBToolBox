[package]
name = "hyperusbd"
version = "0.1.0"
edition = "2021"
description = "Minimal ARM64 Android userspace root daemon for HyperUSB"
license = "GPL-2.0-only OR MIT"

[dependencies]
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = { version = "0.15", features = ["android-api-30"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = "symbols"
